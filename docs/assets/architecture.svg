<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
  <title>Architecture of the Waste Collection Schedule integration (illustration)</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#46505a"/>
    </marker>
  </defs>
  <rect width="960" height="400" fill="#ffffff"/>
  <text x="940" y="388" text-anchor="end" font-size="12" fill="#8a949e">illustration</text>

  <!-- Gladys -->
  <rect x="20" y="40" width="250" height="300" rx="14" fill="#eef4fb" stroke="#2979d6" stroke-width="2"/>
  <text x="145" y="72" text-anchor="middle" font-size="20" font-weight="700" fill="#1d4f8c">Gladys Assistant</text>
  <g font-size="14" fill="#24303c">
    <rect x="40" y="92" width="210" height="38" rx="8" fill="#ffffff" stroke="#b9cde6"/>
    <text x="145" y="116" text-anchor="middle">Discover · devices · states</text>
    <rect x="40" y="140" width="210" height="38" rx="8" fill="#ffffff" stroke="#b9cde6"/>
    <text x="145" y="164" text-anchor="middle">Calendar (calendar variant)</text>
    <rect x="40" y="188" width="210" height="38" rx="8" fill="#ffffff" stroke="#b9cde6"/>
    <text x="145" y="212" text-anchor="middle">Scenes: triggers, actions</text>
    <rect x="40" y="236" width="210" height="38" rx="8" fill="#ffffff" stroke="#b9cde6"/>
    <text x="145" y="260" text-anchor="middle">Dashboard widget</text>
    <rect x="40" y="284" width="210" height="38" rx="8" fill="#ffffff" stroke="#b9cde6"/>
    <text x="145" y="308" text-anchor="middle">Configuration buttons</text>
  </g>

  <!-- Link Gladys / container -->
  <line x1="276" y1="170" x2="374" y2="170" stroke="#46505a" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="325" y="150" text-anchor="middle" font-size="12" fill="#46505a">REST</text>
  <text x="325" y="194" text-anchor="middle" font-size="10" fill="#46505a">/api/integration/v1</text>
  <text x="325" y="210" text-anchor="middle" font-size="12" fill="#46505a">+ WebSocket</text>

  <!-- Container -->
  <rect x="380" y="40" width="300" height="300" rx="14" fill="#edf7f1" stroke="#209678" stroke-width="2"/>
  <text x="530" y="70" text-anchor="middle" font-size="18" font-weight="700" fill="#14614d">Integration container</text>
  <text x="530" y="90" text-anchor="middle" font-size="12" fill="#3b6b5c">read-only rootfs · 256 MB · non-root</text>
  <rect x="400" y="104" width="260" height="78" rx="10" fill="#ffffff" stroke="#a7d8c6"/>
  <text x="530" y="128" text-anchor="middle" font-size="15" font-weight="600" fill="#24303c">Node.js 24 + Gladys SDK</text>
  <text x="530" y="148" text-anchor="middle" font-size="12" fill="#46505a">tick every minute: fetch, midnight,</text>
  <text x="530" y="166" text-anchor="middle" font-size="12" fill="#46505a">reminders, devices or calendars</text>
  <line x1="530" y1="182" x2="530" y2="216" stroke="#46505a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="540" y="204" font-size="11" fill="#46505a">stdin / stdout JSON</text>
  <rect x="400" y="218" width="260" height="66" rx="10" fill="#ffffff" stroke="#a7d8c6"/>
  <text x="530" y="242" text-anchor="middle" font-size="15" font-weight="600" fill="#24303c">python/bridge.py</text>
  <text x="530" y="262" text-anchor="middle" font-size="12" fill="#46505a">Waste Collection Schedule (MIT)</text>
  <text x="530" y="278" text-anchor="middle" font-size="12" fill="#46505a">one short process per fetch</text>
  <rect x="400" y="294" width="260" height="32" rx="8" fill="#ffffff" stroke="#a7d8c6" stroke-dasharray="4 3"/>
  <text x="530" y="315" text-anchor="middle" font-size="12" fill="#46505a">/data/state.json: dates, errors, reminders</text>

  <!-- Link container / sources -->
  <line x1="660" y1="251" x2="754" y2="251" stroke="#46505a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="707" y="240" text-anchor="middle" font-size="12" fill="#46505a">HTTPS</text>

  <!-- Sources -->
  <rect x="760" y="120" width="180" height="220" rx="14" fill="#fff8e6" stroke="#e0a800" stroke-width="2"/>
  <text x="850" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#8a6500">Sources</text>
  <g font-size="13" fill="#24303c">
    <text x="850" y="182" text-anchor="middle">town web sites</text>
    <text x="850" y="208" text-anchor="middle">waste operators</text>
    <text x="850" y="234" text-anchor="middle">apps and APIs</text>
    <text x="850" y="260" text-anchor="middle">ICS calendar links</text>
    <text x="850" y="292" text-anchor="middle" font-size="12" fill="#6b5a2a">nearly 1,000 sources,</text>
    <text x="850" y="310" text-anchor="middle" font-size="12" fill="#6b5a2a">about 30 countries</text>
  </g>
</svg>
