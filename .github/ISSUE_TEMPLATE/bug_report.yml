name: Bug report
description: Something does not work as described in the documentation.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. If the dates of one source are wrong or missing, check first whether the same source works in Home Assistant: the sources come from [Waste Collection Schedule](https://github.com/mampfes/hacs_waste_collection_schedule), and a source broken there is broken here too (report it upstream).
  - type: input
    id: gladys-version
    attributes:
      label: Gladys version
      description: Settings → System.
      placeholder: '5.2.0'
    validations:
      required: true
  - type: input
    id: integration-version
    attributes:
      label: Integration version
      description: Integrations → Waste Collection Schedule (or Waste Collection Calendar), or Settings → Supervision.
      placeholder: '0.1.0'
    validations:
      required: true
  - type: dropdown
    id: variant
    attributes:
      label: Variant
      options:
        - Waste Collection Schedule (devices)
        - Waste Collection Calendar (calendar)
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source and arguments
      description: The source and its arguments, as typed in the configuration. Replace your street and house number by a neighbour's if you prefer.
      placeholder: 'opendata_bordeauxmetropole_fr, {"city": "Bordeaux", "address": "20 Cours Pasteur"}'
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Logs of the integration (Settings → Supervision), ideally with the SDK debug logs: add the environment variable `DEBUG=gladys-integration-sdk` to the container, reproduce, then copy the lines. The message of the "Test the schedules" button helps too.
      render: text
